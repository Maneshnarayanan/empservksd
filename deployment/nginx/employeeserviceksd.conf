# Nginx Production Configuration for employeeserviceksd.com
# Place in /etc/nginx/sites-available/employeeserviceksd.conf
# Symlink to /etc/nginx/sites-enabled/

# 1. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name employeeserviceksd.com www.employeeserviceksd.com;

    # Let's Encrypt ACME challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name employeeserviceksd.com www.employeeserviceksd.com;

    # SSL Certificate configuration (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/employeeserviceksd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/employeeserviceksd.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (Strict Transport Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum client request body (matches MAX_UPLOAD_SIZE_BYTES: 15MB)
    client_max_body_size 16M;

    # Gzip compression for static text/css/js
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Root directory for static assets
    root /var/www/employeeserviceksd/public;

    # Static Assets Caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Uploaded storage files must NOT be directly executed or browsed statically
    location /storage/ {
        internal;
    }

    # Pass all other requests to Node.js Express upstream
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
