<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Login — Employees Service, Kasaragod</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="bg-slate-900 text-slate-100 flex min-h-screen items-center justify-center p-4">

  <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 max-w-md w-full">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold text-2xl mx-auto mb-3 shadow-lg">
        ES
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">Administrator Access</h1>
      <p class="text-xs text-slate-400 mt-1">Employees Service, Kasaragod Portal Administration</p>
    </div>

    <!-- Error/Alert message -->
    <div id="login-alert" class="hidden mb-6 p-4 rounded-xl text-xs font-medium border"></div>

    <!-- Login Form -->
    <form id="admin-login-form" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Username or Email</label>
        <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
      </div>

      <button type="submit" id="login-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition shadow-lg flex items-center justify-center gap-2 mt-2">
        <span>Sign In to Dashboard</span>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-700/60 text-center text-xs text-slate-500">
      <a href="/" class="text-slate-400 hover:text-emerald-400 transition">&larr; Return to Public Website</a>
    </div>
  </div>

  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // If already logged in, redirect directly to dashboard
      try {
        const check = await fetch('/api/v1/admin/auth/me');
        if (check.ok) {
          window.location.href = '/admin/dashboard';
          return;
        }
      } catch (_) {}

      const form = document.getElementById('admin-login-form');
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('login-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Authenticating...';

        const username = form.username.value.trim();
        const password = form.password.value;

        try {
          const res = await apiFetch('/api/v1/admin/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });

          const data = await res.json();

          if (res.ok && data.success) {
            window.location.href = '/admin/dashboard';
          } else {
            alertBox.className = 'mb-6 p-4 rounded-xl text-xs font-medium border bg-rose-950/50 text-rose-300 border-rose-800/80';
            alertBox.textContent = data.message || (data.errors ? data.errors.join(' ') : 'Authentication failed.');
            alertBox.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Sign In to Dashboard';
          }
        } catch (err) {
          alertBox.className = 'mb-6 p-4 rounded-xl text-xs font-medium border bg-rose-950/50 text-rose-300 border-rose-800/80';
          alertBox.textContent = 'Network or connection error. Please try again.';
          alertBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In to Dashboard';
        }
      });
    });
  </script>
</body>
</html>
