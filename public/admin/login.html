<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrator Login — Employees Service, Kasaragod</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="hero-mesh text-slate-100 flex min-h-screen items-center justify-center p-4 relative overflow-hidden">

  <!-- Ambient background glow orbs -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none animate-pulse-glow"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-teal-500/15 rounded-full blur-3xl pointer-events-none animate-float"></div>

  <div class="relative z-10 bg-slate-900/80 backdrop-blur-xl border border-slate-700/70 rounded-2xl shadow-2xl p-8 sm:p-10 max-w-md w-full">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-400 text-white flex items-center justify-center font-extrabold text-2xl mx-auto mb-4 shadow-lg shadow-emerald-950/50 ring-4 ring-emerald-500/20">
        ES
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white font-heading">Administrator Access</h1>
      <p class="text-xs text-slate-400 mt-1.5">Employees Service, Kasaragod Portal Administration</p>
    </div>

    <!-- Error/Alert message -->
    <div id="login-alert" class="hidden mb-6 p-4 rounded-xl text-xs font-medium border"></div>

    <!-- Login Form -->
    <form id="admin-login-form" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Username or Email</label>
        <div class="relative">
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin" class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl pl-10 pr-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        </div>
      </div>

      <div>
        <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••••••" class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl pl-10 pr-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/30 transition">
          <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        </div>
      </div>

      <button type="submit" id="login-submit-btn" class="w-full btn-gradient text-white font-semibold py-3 px-4 rounded-xl text-sm transition shadow-lg shadow-emerald-950/40 flex items-center justify-center gap-2 mt-2">
        <span>Sign In to Dashboard</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
      <a href="/" class="hover:text-emerald-400 transition inline-flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Return to Public Website
      </a>
    </div>
  </div>

  <script src="/assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // If already logged in, redirect directly to dashboard
      try {
        const check = await fetch('/api/v1/admin/auth/me');
        if (check.ok) {
          window.location.href = '/admin/dashboard';
          return;
        }
      } catch (_) {}

      const form = document.getElementById('admin-login-form');
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('login-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Authenticating...';

        const username = form.username.value.trim();
        const password = form.password.value;

        try {
          const res = await apiFetch('/api/v1/admin/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
          });

          const data = await res.json();

          if (res.ok && data.success) {
            window.location.href = '/admin/dashboard';
          } else {
            alertBox.className = 'mb-6 p-4 rounded-xl text-xs font-medium border bg-rose-950/50 text-rose-300 border-rose-800/80';
            alertBox.textContent = data.message || (data.errors ? data.errors.join(' ') : 'Authentication failed.');
            alertBox.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Sign In to Dashboard';
          }
        } catch (err) {
          alertBox.className = 'mb-6 p-4 rounded-xl text-xs font-medium border bg-rose-950/50 text-rose-300 border-rose-800/80';
          alertBox.textContent = 'Network or connection error. Please try again.';
          alertBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.innerHTML = 'Sign In to Dashboard';
        }
      });
    });
  </script>
</body>
</html>
