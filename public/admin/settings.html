          Dashboard

          <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
          Service Portals

        <a href="/admin/service-categories" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition">
          <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
          Categories

        <a href="/admin/downloads" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition">

          Downloads
        </a>
        <a href="/admin/blogs" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition">
          <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>

        <a href="/admin/blog-categories" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition">

          Blog Categories
        </a>
        <a href="/admin/settings" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 transition">
          <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Settings

      </nav>
    </div>

    <div class="p-4 border-t border-slate-800">
      <div class="flex items-center justify-between mb-3">
        <div class="text-xs">
          <span class="block text-white font-semibold admin-username-display">Administrator</span>
          <span class="text-slate-500">Super Admin</span>
        </div>
        <button id="admin-logout-btn" class="p-2 rounded-lg text-slate-400 hover:text-rose-400 hover:bg-slate-800 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
      </div>
      <a href="/" target="_blank" class="block w-full text-center text-xs font-semibold py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
        View Live Website &rarr;
      </a>
    </div>
  </aside>

  <!-- Content View -->
  <main class="flex-grow flex flex-col overflow-y-auto">
    <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between shrink-0">
      <div>
        <h1 class="text-lg font-bold text-slate-900">Website Settings</h1>
        <p class="text-xs text-slate-500">Manage client information and contact details</p>
      </div>
    </header>

    <div class="p-8 max-w-4xl w-full mx-auto space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        <form id="settings-form" class="space-y-6">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Organization Title</label>
            <input type="text" id="setting-site_title" required class="w-full text-xs border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-1 focus:ring-emerald-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Portal Subtitle / Tagline</label>
            <input type="text" id="setting-site_tagline" required class="w-full text-xs border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-1 focus:ring-emerald-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Office Physical Address</label>
            <textarea id="setting-site_address" rows="2" required class="w-full text-xs border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-1 focus:ring-emerald-500 focus:outline-none"></textarea>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Contact Email</label>
              <input type="email" id="setting-contact_email" required class="w-full text-xs border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-1 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Mobile Contact</label>
              <input type="text" id="setting-contact_mobile" required class="w-full text-xs border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-1 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">WhatsApp Helpline</label>
              <input type="text" id="setting-contact_whatsapp" required class="w-full text-xs border border-slate-300 rounded-lg px-3.5 py-2.5 focus:ring-1 focus:ring-emerald-500 focus:outline-none">
            </div>
          </div>

          <div class="pt-4 border-t border-slate-100 flex justify-end">
            <button type="submit" id="settings-save-btn" class="bg-emerald-700 hover:bg-emerald-800 text-white px-6 py-2.5 rounded-lg text-xs font-semibold transition shadow-sm">
              Save Website Settings
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/admin.js"></script>
  <script>
    async function loadSettings() {
      try {
        const res = await fetch('/api/v1/admin/settings');
        const data = await res.json();
        if (data.success && data.map) {
          const m = data.map;
          if (m.site_title) document.getElementById('setting-site_title').value = m.site_title;
          if (m.site_tagline) document.getElementById('setting-site_tagline').value = m.site_tagline;
          if (m.site_address) document.getElementById('setting-site_address').value = m.site_address;
          if (m.contact_email) document.getElementById('setting-contact_email').value = m.contact_email;
          if (m.contact_mobile) document.getElementById('setting-contact_mobile').value = m.contact_mobile;
          if (m.contact_whatsapp) document.getElementById('setting-contact_whatsapp').value = m.contact_whatsapp;
        }
      } catch (err) {
        console.error('Failed to load settings:', err);
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('settings-save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      const payload = {
        site_title: document.getElementById('setting-site_title').value.trim(),
        site_tagline: document.getElementById('setting-site_tagline').value.trim(),
        site_address: document.getElementById('setting-site_address').value.trim(),
        contact_email: document.getElementById('setting-contact_email').value.trim(),
        contact_mobile: document.getElementById('setting-contact_mobile').value.trim(),
        contact_whatsapp: document.getElementById('setting-contact_whatsapp').value.trim(),
      };

      try {
        const res = await apiFetch('/api/v1/admin/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (res.ok && data.success) {
          showToast('Website settings saved successfully.', 'success');
        } else {
          showToast(data.message || 'Failed to save settings.', 'error');
        }
      } catch (err) {
        showToast('Network error during save.', 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save Website Settings';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadSettings();
      document.getElementById('settings-form').addEventListener('submit', handleFormSubmit);
    });
  </script>
</body>
</html>
