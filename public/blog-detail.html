<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — Employees Services, Kasaragod</title>
  <meta id="meta-desc" name="description" content="Read article on employeeserviceksd.com">
  <link rel="stylesheet" href="/assets/css/styles.css?v=2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen font-sans selection:bg-amber-400 selection:text-slate-900">

  <!-- SHARED_HEADER -->

  <!-- 4. Article Container -->
  <main class="flex-grow py-8 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto w-full">
    <!-- Breadcrumb -->
    <nav class="flex items-center justify-between text-xs text-slate-500 mb-6 bg-white px-4 py-2.5 rounded-xl border border-slate-200 shadow-2xs">
      <div class="flex items-center gap-2 truncate">
        <a href="/" class="text-blue-900 font-bold hover:underline">Home</a>
        <span>/</span>
        <a href="/blogs" class="text-blue-900 font-bold hover:underline">Blogs & Web</a>
        <span>/</span>
        <span id="breadcrumb-category" class="text-slate-700 font-medium truncate">Article</span>
      </div>
      <a href="/blogs" class="text-blue-900 font-bold hover:underline shrink-0 text-[11px] hidden sm:inline">
        &larr; All Community Desks
      </a>
    </nav>

    <div id="article-content-wrapper">
      <div class="py-16 text-center text-slate-400 text-xs animate-pulse">Loading article...</div>
    </div>

    <!-- Related Articles Section -->
    <div id="related-articles-section" class="mt-10 pt-8 border-t border-slate-300 hidden">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-extrabold text-slate-900 font-heading">
          More Guidance Notes from Community Desks
        </h3>
        <a href="/blogs" class="text-xs font-bold text-blue-900 hover:underline">View All &rarr;</a>
      </div>
      <div id="related-articles-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- populated dynamically -->
      </div>
    </div>
  </main>

  <!-- SHARED_FOOTER -->
  <script>
    async function loadArticle() {
      const parts = window.location.pathname.split('/');
      const slug = parts[parts.length - 1] || parts[parts.length - 2];
      const wrapper = document.getElementById('article-content-wrapper');

      if (!slug || slug === 'blogs') {
        window.location.href = '/blogs';
        return;
      }

      try {
        const res = await fetch(`/api/v1/blogs/${encodeURIComponent(slug)}`);
        const data = await res.json();

        if (!res.ok || !data.success || !data.data) {
          wrapper.innerHTML = `
            <div class="bg-white rounded-xl border border-slate-300 p-10 text-center text-slate-600 shadow-sm">
              <h1 class="text-lg font-bold text-slate-900 mb-2">Article Not Found</h1>
              <p class="text-xs text-slate-500 mb-4">The article you are looking for does not exist or has not yet been published.</p>
              <a href="/blogs" class="gov-blue-btn inline-flex items-center gap-1.5 text-xs px-4 py-2 rounded-lg">
                &larr; Back to Blogs & Web
              </a>
            </div>
          `;
          return;
        }

        const art = data.data;

        document.title = `${art.title} — Employees Services, Kasaragod`;
        const metaDesc = document.getElementById('meta-desc');
        if (metaDesc && art.summary) metaDesc.setAttribute('content', art.summary);
        document.getElementById('breadcrumb-category').textContent = art.category_name;

        const shareUrl = encodeURIComponent(window.location.href);
        const shareText = encodeURIComponent(`${art.title} - Official Kerala Employee Guidance via Employees Services Kasaragod`);

        wrapper.innerHTML = `
          <article class="bg-white rounded-2xl border border-slate-200 p-6 sm:p-10 shadow-sm">
            <!-- Article Header -->
            <header class="mb-8 pb-6 border-b border-slate-200">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-3 text-xs">
                <div class="flex items-center gap-2">
                  <a href="/blogs?category=${art.category_slug}" class="bg-blue-50 hover:bg-blue-100 text-blue-900 border border-blue-200 text-[11px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wide transition">
                    ${art.category_name}
                  </a>
                  <span class="text-slate-300">•</span>
                  <time class="text-slate-500 font-medium text-xs">${formatDate(art.published_at)}</time>
                </div>
                
                <!-- Share via WhatsApp Button -->
                <a href="https://api.whatsapp.com/send?text=${shareText}%20${shareUrl}" target="_blank" rel="noopener noreferrer" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-300 px-3 py-1 rounded-full text-xs font-bold inline-flex items-center gap-1.5 transition">
                  <span>Share on WhatsApp</span>
                  <svg class="w-3.5 h-3.5 text-emerald-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                </a>
              </div>

              <h1 class="text-2xl sm:text-4xl font-black text-slate-900 tracking-tight leading-tight mb-4 font-heading">
                ${art.title}
              </h1>

              ${art.summary ? `
                <p class="text-sm sm:text-base text-slate-600 font-medium leading-relaxed mb-6 bg-slate-50 p-4 rounded-xl border-l-4 border-blue-900">
                  ${art.summary}
                </p>
              ` : ''}

              <!-- Author / Desk Attribution Card -->
              <div class="flex items-center justify-between gap-4 pt-2">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-full bg-blue-900 text-amber-300 flex items-center justify-center font-extrabold text-sm shadow-xs">
                    ${(art.author_name || 'A').charAt(0).toUpperCase()}
                  </div>
                  <div>
                    <span class="font-extrabold text-slate-900 text-xs sm:text-sm block">${art.author_name}</span>
                    <span class="text-slate-500 text-[11px]">Employees Services Kasaragod Verified Desk</span>
                  </div>
                </div>

                <a href="/blogs?category=${art.category_slug}" class="text-blue-900 hover:text-blue-700 text-xs font-extrabold hidden sm:inline">
                  View More in ${art.category_name} &rarr;
                </a>
              </div>
            </header>

            ${art.featured_image ? `
              <div class="mb-8 rounded-xl overflow-hidden max-h-96 w-full bg-slate-100 border border-slate-200 shadow-xs">
                <img src="${art.featured_image}" alt="${art.title}" class="w-full h-full object-cover">
              </div>
            ` : ''}

            <!-- Article Body Content -->
            <div class="prose-content text-slate-800 leading-relaxed text-sm sm:text-base">
              ${art.content}
            </div>

            <!-- Helpline / Questions Callout -->
            <div class="mt-10 bg-blue-50 border border-blue-200 rounded-xl p-5 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <h4 class="font-extrabold text-blue-950 text-xs uppercase tracking-wide">Have questions about this article or rule?</h4>
                <p class="text-xs text-blue-800 mt-0.5">Contact the Employees Services Help Desk via WhatsApp for rapid clarification.</p>
              </div>
              <a href="https://wa.me/919447396181" target="_blank" rel="noopener noreferrer" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-xs shrink-0 shadow-xs transition">
                WhatsApp 9447396181
              </a>
            </div>

            <footer class="mt-8 pt-4 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-3 text-xs">
              <a href="/blogs" class="text-blue-900 hover:underline font-bold flex items-center gap-1">
                &larr; Back to all community articles
              </a>
              <span class="text-slate-400 font-medium">Employees Services, Kasaragod</span>
            </footer>
          </article>
        `;

        loadRelatedArticles(art.category_slug, art.id);
      } catch (err) {
        console.error('Error loading article:', err);
      }
    }

    async function loadRelatedArticles(categorySlug, currentId) {
      try {
        const res = await fetch(`/api/v1/blogs?limit=3&category=${encodeURIComponent(categorySlug)}`);
        const data = await res.json();
        if (data.success && data.articles.length > 0) {
          const filtered = data.articles.filter(a => a.id !== currentId).slice(0, 2);
          if (filtered.length > 0) {
            const section = document.getElementById('related-articles-section');
            const grid = document.getElementById('related-articles-grid');
            if (section && grid) {
              section.classList.remove('hidden');
              grid.innerHTML = filtered.map(item => `
                <a href="/blogs/${item.slug}" class="bg-white rounded-xl border border-slate-200 p-4 hover:border-blue-900 hover:shadow-md transition block group">
                  <div class="flex items-center gap-2 mb-1.5 text-[10px] font-bold text-blue-900">
                    <span class="bg-blue-50 px-2 py-0.5 rounded border border-blue-200">${item.category_name}</span>
                    <span class="text-slate-400 font-medium">${formatDate(item.published_at)}</span>
                  </div>
                  <h4 class="font-bold text-xs sm:text-sm text-slate-900 group-hover:text-blue-900 transition-colors line-clamp-2 leading-snug">
                    ${item.title}
                  </h4>
                  <p class="text-[11px] text-slate-500 line-clamp-2 mt-1 leading-relaxed">
                    ${item.summary || 'Click to view complete administrative notes.'}
                  </p>
                </a>
              `).join('');
            }
          }
        }
      } catch (err) {
        console.error('Failed to load related articles:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadArticle);
  </script>
</body>
</html>
