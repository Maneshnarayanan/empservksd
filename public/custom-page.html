<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}} — Employees Services, Kasaragod</title>
  <meta name="description" content="{{PAGE_META_DESC}}">
  <link rel="stylesheet" href="/assets/css/styles.css?v=3">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen font-sans selection:bg-amber-400 selection:text-slate-900">

  <!-- SHARED_HEADER -->

  <main class="flex-grow py-6 sm:py-8 px-4 sm:px-6 lg:px-8 {{PAGE_CONTAINER_CLASS}} mx-auto w-full">
    <!-- Breadcrumb Bar -->
    <nav class="flex items-center justify-between text-xs text-slate-500 mb-6 bg-white px-4 py-2.5 rounded-xl border border-slate-200 shadow-2xs">
      <div class="flex items-center gap-2 truncate">
        <a href="/" class="text-blue-900 font-bold hover:underline">Home</a>
        <span>/</span>
        <span class="text-slate-700 font-semibold truncate">{{PAGE_BREADCRUMB_TITLE}}</span>
      </div>
      <a href="/" class="text-blue-900 font-bold hover:underline shrink-0 text-[11px] hidden sm:inline">
        &larr; Back to Portal Home
      </a>
    </nav>

    <!-- Page Layout Wrapper -->
    {{PAGE_BODY_SLOT}}
  </main>

  <!-- SHARED_FOOTER -->

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Accessibility Font Resize Controls (matches index.html)
      let currentFontSize = 100;
      const rootHtml = document.documentElement;
      document.getElementById('btn-font-inc')?.addEventListener('click', () => {
        if (currentFontSize < 130) {
          currentFontSize += 10;
          rootHtml.style.fontSize = `${currentFontSize}%`;
        }
      });
      document.getElementById('btn-font-dec')?.addEventListener('click', () => {
        if (currentFontSize > 85) {
          currentFontSize -= 10;
          rootHtml.style.fontSize = `${currentFontSize}%`;
        }
      });
      document.getElementById('btn-font-reset')?.addEventListener('click', () => {
        currentFontSize = 100;
        rootHtml.style.fontSize = '100%';
      });

      const escapeSafe = (str) => {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      };

      // Hydrate sidebar Popular Quick Links if sidebar mode is active
      const quickLinksContainer = document.getElementById('sidebar-popular-articles-list');
      if (quickLinksContainer) {
        try {
          const res = await fetch('/api/v1/quick-links');
          const data = await res.json();
          if (data && data.success && Array.isArray(data.data) && data.data.length > 0) {
            quickLinksContainer.innerHTML = data.data.map(item => {
              const safeTitle = escapeSafe(item.title);
              const safeUrl = (item.url || '#').replace(/"/g, '&quot;');
              const targetAttr = item.target_blank ? 'target="_blank" rel="noopener noreferrer"' : '';
              const badgeHtml = item.badge_text
                ? `<span class="bg-red-600 text-white font-black text-[9px] uppercase px-1.5 py-0.2 rounded shrink-0 animate-pulse">${escapeSafe(item.badge_text)}</span>`
                : '';
              return `
                <a href="${safeUrl}" ${targetAttr} class="block px-3.5 py-2 hover:bg-blue-50 text-blue-900 hover:text-blue-700 font-medium transition flex items-center justify-between group">
                  <span class="flex items-center gap-1.5 min-w-0 pr-2">
                    <span class="truncate">${safeTitle}</span>
                    ${badgeHtml}
                  </span>
                  <span class="text-slate-400 group-hover:translate-x-0.5 transition-transform text-[10px] shrink-0">&rarr;</span>
                </a>
              `;
            }).join('');
          }
        } catch (err) {
          console.warn('Could not load sidebar quick links:', err);
        }
      }

      // Hydrate sidebar Latest Downloads if sidebar mode is active
      const downloadsContainer = document.getElementById('sidebar-latest-downloads-list');
      if (downloadsContainer) {
        try {
          const res = await fetch('/api/v1/downloads?limit=4');
          const data = await res.json();
          if (data && data.success && Array.isArray(data.data) && data.data.length > 0) {
            downloadsContainer.innerHTML = data.data.map((item, idx) => {
              const d = new Date(item.created_at);
              const dateLabel = isNaN(d.getTime())
                ? ''
                : `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
              const isLast = idx === data.data.length - 1;
              return `
                <div class="${isLast ? '' : 'border-b border-slate-100 pb-2'}">
                  <a href="/api/v1/downloads/${item.id}/file" target="_blank" rel="noopener noreferrer" class="text-blue-900 hover:text-blue-700 font-bold block leading-snug group">
                    <span class="group-hover:underline">📄 ${escapeSafe(item.title)}</span>
                  </a>
                  <div class="flex items-center gap-2 text-[10px] text-slate-500 font-mono mt-0.5">
                    <span>${dateLabel}</span>
                    <span>•</span>
                    <span class="text-emerald-700 font-medium truncate">${escapeSafe(item.category || 'Orders')}</span>
                  </div>
                </div>
              `;
            }).join('');
          }
        } catch (err) {
          console.warn('Could not load sidebar downloads:', err);
        }
      }
    });
  </script>
</body>
</html>
