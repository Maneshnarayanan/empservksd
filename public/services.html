<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Directory — Employees Services, Kasaragod</title>
  <meta name="description" content="Categorized Employees Services portals for Kerala state employees: SPARK, BIMS, e-Treasury, Tax, Kerala Finance Services, PF, KITE, Insurance, PRISM, and Medisep.">
  <link rel="stylesheet" href="/assets/css/styles.css?v=2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col min-h-screen font-sans selection:bg-amber-400 selection:text-slate-900">

  <!-- SHARED_HEADER -->

  <!-- 4. Page Header Banner (Government Style) -->
  <main class="flex-grow">
    <div class="gov-hero-gradient text-white py-10 px-4 sm:px-6 lg:px-8 border-b-4 border-amber-500">
      <div class="max-w-7xl mx-auto">
        <div class="inline-flex items-center gap-2 px-3 py-1 bg-blue-950/80 rounded border border-blue-400/40 text-xs font-bold text-amber-300 mb-3 shadow-sm">
          <span>🏛️</span>
          <span>OFFICIAL APPLICATION DIRECTORY</span>
        </div>
        <h1 class="text-2xl sm:text-4xl font-black tracking-tight mb-2 font-heading uppercase text-white">
          Employees Services & Government Portals
        </h1>
        <p class="text-xs sm:text-sm text-blue-100 max-w-2xl leading-relaxed font-medium">
          Categorized single-window access to all Kerala state department portals for employees, teachers, DDOs, and pensioners across Kasaragod district.
        </p>

        <!-- Live Search Input -->
        <div class="mt-6 max-w-xl bg-white p-1.5 rounded-xl shadow-lg flex items-center gap-2 text-slate-800">
          <svg class="w-5 h-5 text-slate-400 ml-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" id="service-search-input" placeholder="Filter by portal name or keyword (e.g. SPARK, BIMS, Sampoorna, GPF)..." class="w-full py-1.5 px-2 text-sm font-medium focus:outline-none placeholder-slate-400">
        </div>
      </div>
    </div>

    <!-- 5. Main Content Container -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- Category Filter Pills with Scroll Controls -->
      <div class="mb-8 relative">
        <!-- Scroll Left Button -->
        <button id="pills-scroll-left" class="hidden sm:flex absolute -left-3.5 top-1/2 -translate-y-1/2 z-10 w-9 h-9 rounded-full bg-white shadow-md border border-slate-300 text-slate-700 hover:text-blue-900 hover:bg-slate-50 items-center justify-center transition-all duration-200 cursor-pointer" aria-label="Scroll categories left">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
        </button>

        <!-- Scrollable Pills Container -->
        <div class="flex items-center gap-2 overflow-x-auto pb-3 pt-1 px-1 scroll-smooth select-none cursor-grab active:cursor-grabbing border-b border-slate-200/80" id="category-pills" style="scrollbar-width: thin; scrollbar-color: #cbd5e1 #f8fafc;">
          <button class="category-pill active bg-blue-900 text-white border border-blue-950 px-4 py-1.5 rounded text-xs font-bold whitespace-nowrap transition shadow-2xs shrink-0" data-category="">
            All Portals
          </button>
        </div>

        <!-- Scroll Right Button -->
        <button id="pills-scroll-right" class="hidden sm:flex absolute -right-3.5 top-1/2 -translate-y-1/2 z-10 w-9 h-9 rounded-full bg-white shadow-md border border-slate-300 text-slate-700 hover:text-blue-900 hover:bg-slate-50 items-center justify-center transition-all duration-200 cursor-pointer" aria-label="Scroll categories right">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>

      <!-- Services Grid -->
      <div id="services-container" class="space-y-8">
        <div class="py-12 text-center text-slate-400 text-xs animate-pulse">Loading service directory...</div>
      </div>
    </div>
  </main>

  <!-- SHARED_FOOTER -->
  <script>
    let allCategories = [];
    let allLinks = [];
    let activeCategoryId = '';

    async function loadData() {
      try {
        const [catRes, linkRes] = await Promise.all([
          fetch('/api/v1/services/categories'),
          fetch('/api/v1/services')
        ]);
        const catData = await catRes.json();
        const linkData = await linkRes.json();

        if (catData.success) allCategories = catData.data;
        if (linkData.success) allLinks = linkData.data;

        renderCategoryPills();

        const params = new URLSearchParams(window.location.search);
        const catParam = params.get('category');
        const searchParam = params.get('search');

        if (catParam) {
          activeCategoryId = catParam;
          document.querySelectorAll('.category-pill').forEach(btn => {
            if (btn.dataset.category === catParam) {
              btn.classList.add('bg-blue-900', 'text-white', 'border-blue-950');
              btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-300');
              setTimeout(() => {
                btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
              }, 120);
            } else {
              btn.classList.remove('bg-blue-900', 'text-white', 'border-blue-950');
              btn.classList.add('bg-white', 'text-slate-700', 'border-slate-300');
            }
          });
        }

        if (searchParam) {
          const searchInput = document.getElementById('service-search-input');
          if (searchInput) searchInput.value = searchParam;
        }

        renderServices();
      } catch (err) {
        console.error('Failed to load services:', err);
      }
    }

    let updatePillScrollButtons = () => {};

    function setupCategoryScroll() {
      const container = document.getElementById('category-pills');
      const btnLeft = document.getElementById('pills-scroll-left');
      const btnRight = document.getElementById('pills-scroll-right');

      if (!container) return;

      updatePillScrollButtons = function() {
        if (!btnLeft || !btnRight) return;
        const maxScroll = container.scrollWidth - container.clientWidth;
        if (maxScroll <= 8) {
          btnLeft.style.display = 'none';
          btnRight.style.display = 'none';
          return;
        }
        btnLeft.style.display = 'flex';
        btnRight.style.display = 'flex';
        btnLeft.style.opacity = container.scrollLeft <= 8 ? '0.3' : '1';
        btnLeft.style.pointerEvents = container.scrollLeft <= 8 ? 'none' : 'auto';
        btnRight.style.opacity = container.scrollLeft >= maxScroll - 8 ? '0.3' : '1';
        btnRight.style.pointerEvents = container.scrollLeft >= maxScroll - 8 ? 'none' : 'auto';
      };

      if (btnLeft) {
        btnLeft.addEventListener('click', () => {
          container.scrollBy({ left: -260, behavior: 'smooth' });
          setTimeout(updatePillScrollButtons, 300);
        });
      }

      if (btnRight) {
        btnRight.addEventListener('click', () => {
          container.scrollBy({ left: 260, behavior: 'smooth' });
          setTimeout(updatePillScrollButtons, 300);
        });
      }

      // Mouse wheel horizontal scroll conversion
      container.addEventListener('wheel', (e) => {
        if (e.deltaY !== 0) {
          e.preventDefault();
          container.scrollLeft += e.deltaY;
          updatePillScrollButtons();
        }
      }, { passive: false });

      // Click & drag to scroll
      let isDown = false;
      let startX, scrollLeftPos;

      container.addEventListener('mousedown', (e) => {
        isDown = true;
        startX = e.pageX - container.offsetLeft;
        scrollLeftPos = container.scrollLeft;
      });

      window.addEventListener('mouseup', () => {
        isDown = false;
      });

      container.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        const x = e.pageX - container.offsetLeft;
        const walk = (x - startX) * 1.5;
        container.scrollLeft = scrollLeftPos - walk;
        updatePillScrollButtons();
      });

      container.addEventListener('scroll', updatePillScrollButtons, { passive: true });
      window.addEventListener('resize', updatePillScrollButtons, { passive: true });
      setTimeout(updatePillScrollButtons, 200);
    }

    function renderCategoryPills() {
      const pillsContainer = document.getElementById('category-pills');
      const pillsHtml = allCategories.map(cat => `
        <button class="category-pill bg-white text-slate-700 hover:bg-slate-50 border border-slate-300 px-3.5 py-1.5 rounded text-xs font-semibold whitespace-nowrap transition shrink-0" data-category="${cat.id}">
          ${cat.name} (${cat.links_count})
        </button>
      `).join('');

      pillsContainer.innerHTML = `
        <button class="category-pill active bg-blue-900 text-white border border-blue-950 px-3.5 py-1.5 rounded text-xs font-bold whitespace-nowrap transition shadow-2xs shrink-0" data-category="">
          All Portals (${allLinks.length})
        </button>
        ${pillsHtml}
      `;

      pillsContainer.querySelectorAll('.category-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          pillsContainer.querySelectorAll('.category-pill').forEach(b => {
            b.classList.remove('bg-blue-900', 'text-white', 'border-blue-950');
            b.classList.add('bg-white', 'text-slate-700', 'border-slate-300');
          });
          btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-300');
          btn.classList.add('bg-blue-900', 'text-white', 'border-blue-950');
          activeCategoryId = btn.dataset.category;
          btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
          renderServices();
        });
      });

      setTimeout(() => {
        if (typeof updatePillScrollButtons === 'function') {
          updatePillScrollButtons();
        }
      }, 100);
    }

    function renderServices() {
      const searchInput = document.getElementById('service-search-input');
      const searchTerm = searchInput ? searchInput.value.trim().toLowerCase() : '';
      const container = document.getElementById('services-container');

      let targetCategories = allCategories;
      if (activeCategoryId) {
        targetCategories = allCategories.filter(c => c.id == activeCategoryId);
      }

      let html = '';
      let totalFound = 0;

      targetCategories.forEach(cat => {
        const catLinks = allLinks.filter(l => l.category_id === cat.id && (
          !searchTerm || l.name.toLowerCase().includes(searchTerm) || (l.description && l.description.toLowerCase().includes(searchTerm))
        ));

        if (catLinks.length > 0) {
          totalFound += catLinks.length;
          html += `
            <div class="bg-white rounded-lg shadow-sm border border-slate-300 overflow-hidden">
              <div class="gov-panel-header px-4 py-3 flex items-center justify-between">
                <div>
                  <h2 class="text-sm font-extrabold uppercase tracking-wide text-white">${cat.name}</h2>
                  <p class="text-[11px] text-blue-200 mt-0.5">${cat.description || 'Employee services and portals'}</p>
                </div>
                <span class="text-xs font-bold bg-amber-400 text-slate-900 px-2.5 py-0.5 rounded shadow-2xs">
                  ${catLinks.length} ${catLinks.length === 1 ? 'portal' : 'portals'}
                </span>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 p-4 bg-slate-50/50">
                ${catLinks.map(link => {
                  const hasUrl = link.destination_url && link.destination_url.trim() !== '';
                  return `
                    <div class="border border-slate-200 hover:border-blue-800 rounded-lg p-3.5 flex flex-col justify-between transition-all bg-white shadow-2xs">
                      <div>
                        <div class="flex items-start justify-between gap-2 mb-2">
                          <h3 class="font-extrabold text-slate-900 text-xs">${link.name}</h3>
                          ${hasUrl
                            ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">Active</span>`
                            : `<span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-300" title="Configurable by administrator">Setup</span>`
                          }
                        </div>
                        <p class="text-xs text-slate-600 mb-3 leading-relaxed">${link.description || 'Employee official portal access.'}</p>
                      </div>

                      <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
                        ${hasUrl
                          ? `<a href="${link.destination_url}" target="_blank" rel="noopener noreferrer" class="gov-blue-btn inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1 rounded transition">
                              <span>Open Portal</span>
                              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </a>`
                          : `<span class="text-[11px] text-amber-800 font-semibold flex items-center gap-1 bg-amber-50 px-2 py-0.5 rounded border border-amber-200">
                              <span>Link under setup</span>
                            </span>`
                        }
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }
      });

      if (totalFound === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-lg border border-slate-300 p-8 text-center text-slate-500">
            <h3 class="text-sm font-bold text-slate-800">No matching services found</h3>
            <p class="text-xs text-slate-500 mt-1">Try clearing your search term or selecting a different category.</p>
          </div>
        `;
      } else {
        container.innerHTML = html;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      setupCategoryScroll();
      loadData();
      const searchInput = document.getElementById('service-search-input');
      if (searchInput) {
        searchInput.addEventListener('input', () => {
          renderServices();
        });
      }
    });
  </script>
</body>
</html>
